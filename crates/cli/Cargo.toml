[package]
name = "skillchk"
version = "1.0.0"
edition = "2021"
description = "CLI for skill-scanner: scan agent skill marketplaces for security risks"

[[bin]]
name = "skillchk"
path = "src/main.rs"

[dependencies]
skill-scanner-core = { path = "../core" }
clap = { workspace = true }
colored = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = { workspace = true }
