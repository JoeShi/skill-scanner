[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/rules",
    "crates/ruleset",
    "crates/manifest",
    "crates/clawhub",
    "crates/cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
authors = ["Joe Shi and contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.10"
once_cell = "1.19"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros"] }
url = "2.5"
mime = "0.3"
toml = "0.8"
bytes = "1.6"
tempfile = "3.10"
