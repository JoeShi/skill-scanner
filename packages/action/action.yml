name: 'Skill Scanner'
description: 'Scan agent skill marketplaces for security risks (R0-R11 static analysis)'
author: 'skill-scanner'

inputs:
  target:
    description: 'Skill marketplace URL or local directory to scan'
    required: true
  fail-on:
    description: 'Fail the Action if findings reach this severity (P0, P1, none)'
    required: false
    default: 'P0'
  format:
    description: 'Output format (terminal, json, markdown, sarif)'
    required: false
    default: 'sarif'
  ruleset:
    description: 'Path to custom ruleset YAML (optional)'
    required: false

outputs:
  sarif-file:
    description: 'Path to generated SARIF file (for upload-sarif action)'
  findings-count:
    description: 'Total number of findings'
  blocked:
    description: 'true if scan result exceeds fail-on threshold'

runs:
  using: 'node20'
  main: 'dist/index.js'
